name: Java CI

on:
  push:
    # Build changes to all branches
    branches: ["**"]
    # Build semver tags
    tags: ["*.*.*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: hardcorelife-${{ steps.get_version.outputs.VERSION }}
      project_version: ${{ steps.get_project_version.outputs.PROJECT_VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install JDK
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven # Dramatically decreases build times

      - name: Build with Maven
        run: ./mvnw --batch-mode --update-snapshots verify

      - name: Prepare .jar file(s) for artifacting
        run: |
          mkdir staging && cp target/*.jar staging
          rm staging/original-*.jar

      - name: Read the project version from pom.xml
        id: get_project_version
        run: echo "PROJECT_VERSION=$(./mvnw --batch-mode --quiet help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Set the build version name
        id: get_version
        # Artifact names can't contain slashes, which branch names often do
        run: echo "VERSION=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact(s)
        uses: actions/upload-artifact@v7
        with:
          name: hardcorelife-${{ steps.get_version.outputs.VERSION }}
          path: staging

  release:
    # Publish a GitHub release when a semver tag is pushed, or when master
    # carries a pom.xml version that hasn't been released yet
    needs: build
    if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Decide whether to release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_VERSION: ${{ needs.build.outputs.project_version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$PROJECT_VERSION" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pom.xml version $PROJECT_VERSION"
              exit 1
            fi
          elif [[ "$PROJECT_VERSION" == *-SNAPSHOT ]]; then
            echo "::notice::Skipping release of snapshot version $PROJECT_VERSION"
            exit 0
          fi
          if gh release view "$PROJECT_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $PROJECT_VERSION already exists"
            exit 0
          fi
          echo "VERSION=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download build artifact(s)
        if: steps.check.outputs.VERSION
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: staging

      - name: Create the release
        if: steps.check.outputs.VERSION
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.VERSION }}
        # Creates the tag at this commit if it doesn't exist yet
        run: |
          gh release create "$VERSION" staging/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
